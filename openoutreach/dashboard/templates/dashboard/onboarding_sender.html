{% extends "dashboard/base.html" %}
{% block page_title %}Add Sender Identity{% endblock %}
{% block main_content %}
<div class="card p-4">
  <h2>Add Sender Identity (Workspace: {{ workspace.name }})</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Display Name</label>
      <input type="text" name="display_name" class="form-control" placeholder="e.g. Alice Smith" required>
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input type="email" name="email" class="form-control" placeholder="alice@acme.com" required>
    </div>
    <div class="mb-3">
      <label>Sender Type</label>
      <select name="sender_type" class="form-select">
        <option value="individual">Individual</option>
        <option value="company_brand">Company Brand</option>
        <option value="executive_proxy">Executive Proxy</option>
        <option value="academic_candidacy">Academic Candidacy</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Continue to Campaign Purpose</button>
  </form>
</div>
{% endblock %}

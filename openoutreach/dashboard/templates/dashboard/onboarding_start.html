{% extends "dashboard/base.html" %}
{% block page_title %}Create a Workspace{% endblock %}
{% block main_content %}
<div class="card p-4">
  <h2>Create a Workspace</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Workspace Name</label>
      <input type="text" name="name" class="form-control" placeholder="e.g. Acme Corp" required>
    </div>
    <div class="mb-3">
      <label>Workspace Slug</label>
      <input type="text" name="slug" class="form-control" placeholder="e.g. acme-corp" required>
    </div>
    <button type="submit" class="btn btn-primary">Create Workspace</button>
  </form>
</div>
{% endblock %}

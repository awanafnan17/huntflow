{% extends "dashboard/base.html" %}
{% block page_title %}Create Sender Identity{% endblock %}
{% block main_content %}
<div class="card p-4">
  <h2>Create Sender Identity</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label>Display Name</label><input type="text" name="display_name" class="form-control" required></div>
    <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label>LinkedIn URL</label><input type="url" name="linkedin_profile_url" class="form-control"></div>
    <div class="mb-3"><label>Company / Brand</label><input type="text" name="company_or_brand" class="form-control"></div>
    <button type="submit" class="btn btn-success">Save Sender</button>
  </form>
</div>
{% endblock %}

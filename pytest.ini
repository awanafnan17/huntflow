[pytest]
pythonpath = .
testpaths = tests
DJANGO_SETTINGS_MODULE = openoutreach.settings
markers =
    no_embed_mock: skip the autouse fastembed mock
    no_contact_capture_mock: skip the autouse contact-info capture mock
filterwarnings =
    ignore:.*teardown test databases.*:pytest.PytestWarning
    ignore:.*database.*is being accessed by other users.*:UserWarning
